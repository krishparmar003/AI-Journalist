<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Journalist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗞️</text></svg>">
<style>
  :root {
    --bg: #f3eee2; --card: #fbf8f1; --text: #1f1a14; --muted: #6b6256;
    --border: #d6ccb8; --accent: #8b1a1a; --accent-text: #fffaf0; --ok: #2e6b34; --err: #a4161a;
    --serif: Georgia, "Noto Serif", "Noto Serif Devanagari", "Noto Serif Gujarati", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Gujarati", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17130f; --card: #201b15; --text: #ece4d4; --muted: #a09584;
      --border: #3a3228; --accent: #b5322f; --accent-text: #fffaf0; --ok: #7bc47f; --err: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.6; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 64px; }

  .masthead { text-align: center; border-top: 4px double var(--text); border-bottom: 1px solid var(--text);
              padding: 14px 0 12px; margin-bottom: 24px; }
  .dateline { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: var(--serif); font-size: clamp(2rem, 7vw, 3.1rem); font-weight: 700; letter-spacing: -.5px;
       line-height: 1.1; margin: 6px 0 4px; }
  .sub { margin: 0; color: var(--muted); font-family: var(--serif); font-style: italic; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 3px; padding: 20px;
          margin-bottom: 16px; box-shadow: 0 1px 0 var(--border); }
  label { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
          color: var(--muted); margin-bottom: 6px; }
  textarea, select, input[type=password] {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
  }
  textarea { resize: vertical; font-family: var(--serif); font-size: 1.05rem; }
  textarea:focus, select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin: 16px 0; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 600; margin: 8px 0 12px;
           text-transform: none; letter-spacing: 0; font-size: .9rem; color: var(--text); }
  .check input { accent-color: var(--accent); }
  details { margin: 12px 0; }
  summary { cursor: pointer; font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
  .keys { display: grid; gap: 12px; margin-top: 12px; }
  .hint { color: var(--muted); font-size: .8rem; margin: 8px 0 0; }
  button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 3px; padding: 10px 18px;
           border: 1px solid var(--text); background: transparent; color: var(--text); }
  button:hover { background: var(--border); }
  button.primary { width: 100%; background: var(--accent); color: var(--accent-text); border-color: var(--accent);
                   padding: 12px; text-transform: uppercase; letter-spacing: .12em; font-size: .85rem; }
  button.primary:hover { filter: brightness(1.1); background: var(--accent); }
  button:disabled { opacity: .6; cursor: wait; }
  ul#steps { list-style: none; margin: 0; padding: 0; }
  ul#steps li { padding: 4px 0; font-family: var(--serif); }
  ul#steps li.done::before { content: "\2713  "; color: var(--ok); font-weight: 700; }
  ul#steps li.working { color: var(--muted); font-style: italic; }
  ul#steps li.working::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 8px;
      border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 8px; }
  .actions button { padding: 5px 12px; font-size: .78rem; }
  #result { overflow-wrap: anywhere; font-family: var(--serif); font-size: 1.08rem; line-height: 1.8; }
  #result h1, #result h2, #result h3 { font-family: var(--serif); line-height: 1.25; letter-spacing: -.2px; }
  #result h1 { font-size: 1.9rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  #result a { color: var(--accent); }
  #result blockquote { margin: 1em 0; padding-left: 1em; border-left: 3px solid var(--accent); color: var(--muted); }
  #sources a { color: var(--accent); }
  .error { color: var(--err); background: color-mix(in srgb, var(--err) 10%, transparent);
           border: 1px solid var(--err); border-radius: 3px; padding: 10px 14px; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase;
           margin-top: 28px; border-top: 1px solid var(--border); padding-top: 14px; }
</style>
</head>
<body>
<main>
  <header class="masthead">
    <div class="dateline" id="dateline"></div>
    <h1>AI Journalist</h1>
    <p class="sub">Researches, writes and edits articles, blogs and posts in your language.</p>
  </header>

  <section class="card">
    <label for="topic">What do you want to write about?</label>
    <textarea id="topic" rows="2" maxlength="500" placeholder="e.g. How AI is changing drug discovery"></textarea>

    <div class="grid">
      <div><label for="language">Language</label>
        <select id="language"><option>English</option><option>Hindi</option><option>Gujarati</option><option>Marathi</option><option>Bengali</option><option>Tamil</option></select></div>
      <div><label for="contentType">Content type</label>
        <select id="contentType"><option>Article</option><option>Blog post</option><option>LinkedIn post</option><option>Essay</option><option>Email</option></select></div>
      <div><label for="tone">Tone</label>
        <select id="tone"><option>Professional</option><option>Conversational</option><option>Formal</option><option>Inspirational</option><option>Analytical</option></select></div>
      <div><label for="length">Length</label>
        <select id="length"><option value="short">Short (~300 words)</option><option value="medium" selected>Medium (~800 words)</option><option value="long">Long (~1500 words)</option></select></div>
      <div><label for="model">Model</label>
        <select id="model"><option value="openai/gpt-oss-120b">GPT-OSS 120B (best quality)</option><option value="qwen/qwen3.6-27b">Qwen 3.6 27B (multilingual)</option><option value="openai/gpt-oss-20b">GPT-OSS 20B (faster)</option></select></div>
    </div>

    <label class="check"><input type="checkbox" id="useWeb" checked> Research the web first</label>

    <details id="keysBox" open>
      <summary>Access</summary>
      <div class="keys">
        <div><label for="mode">How do you want to use it?</label>
          <select id="mode"><option value="keys">Use my own API keys</option><option value="owner">Owner access (password)</option></select></div>
        <div id="keysFields" class="keys">
          <div><label for="groqKey">Groq API key</label><input type="password" id="groqKey" autocomplete="off" placeholder="gsk_..."></div>
          <div><label for="tavilyKey">Tavily API key (needed for web research)</label><input type="password" id="tavilyKey" autocomplete="off" placeholder="tvly-..."></div>
        </div>
        <div id="ownerFields" class="hidden"><label for="ownerPw">Owner password</label><input type="password" id="ownerPw" autocomplete="off"></div>
      </div>
      <p class="hint" id="keysHint">Free keys: console.groq.com and app.tavily.com. Keys stay in this browser tab and are only sent with your request.</p>
    </details>

    <button id="go" class="primary">Generate</button>
  </section>

  <p id="err" class="error hidden"></p>

  <section id="progress" class="card hidden"><ul id="steps"></ul></section>

  <section id="out" class="card hidden">
    <div class="actions"><button id="copy">Copy</button><button id="dl">Download .md</button></div>
    <article id="result"></article>
    <details id="srcBox" class="hidden"><summary>Sources</summary><ol id="sources"></ol></details>
    <details id="fbBox" class="hidden"><summary>Editor feedback</summary><p id="feedback"></p></details>
  </section>

  <footer>Built with LangGraph, Groq and Tavily</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const STEP_LABELS = {
  plan: "Planned search queries", research: "Researched the web", write: "Wrote the draft",
  critique: "Editor reviewed the draft", revise: "Revised the draft",
};
let currentDraft = "";
$("dateline").textContent = new Date().toLocaleDateString(undefined,
  { weekday: "long", year: "numeric", month: "long", day: "numeric" });

$("groqKey").value = sessionStorage.getItem("groqKey") || "";
$("tavilyKey").value = sessionStorage.getItem("tavilyKey") || "";
$("ownerPw").value = sessionStorage.getItem("ownerPw") || "";
$("mode").value = sessionStorage.getItem("mode") || "keys";

function applyMode() {
  const owner = $("mode").value === "owner";
  $("keysFields").classList.toggle("hidden", owner);
  $("ownerFields").classList.toggle("hidden", !owner);
  $("keysHint").classList.toggle("hidden", owner);
}
$("mode").addEventListener("change", applyMode);
applyMode();

function showError(msg) { const e = $("err"); e.textContent = msg; e.classList.remove("hidden"); }
function clearError() { $("err").classList.add("hidden"); }

function setWorking(on) {
  const old = document.querySelector("#steps li.working");
  if (old) old.remove();
  if (on) {
    const li = document.createElement("li");
    li.className = "working"; li.textContent = "Working...";
    $("steps").appendChild(li);
  }
}
function addStep(node) {
  setWorking(false);
  const li = document.createElement("li");
  li.className = "done"; li.textContent = STEP_LABELS[node] || node;
  $("steps").appendChild(li);
  setWorking(true);
}

function showResult(r) {
  currentDraft = r.draft || "";
  const html = (window.marked && window.DOMPurify)
    ? DOMPurify.sanitize(marked.parse(currentDraft)) : null;
  if (html !== null) $("result").innerHTML = html; else $("result").textContent = currentDraft;

  const list = $("sources"); list.innerHTML = "";
  (r.sources || []).forEach((s) => {
    const li = document.createElement("li");
    if (/^https?:\/\//i.test(s.url)) {
      const a = document.createElement("a");
      a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = s.title || s.url;
      li.appendChild(a);
    } else { li.textContent = s.title || ""; }
    list.appendChild(li);
  });
  $("srcBox").classList.toggle("hidden", !(r.sources || []).length);
  $("feedback").textContent = r.feedback || "";
  $("fbBox").classList.toggle("hidden", !r.feedback);
  $("out").classList.remove("hidden");
}

function handleEvent(ev) {
  if (ev.type === "step") addStep(ev.node);
  else if (ev.type === "result") { setWorking(false); showResult(ev); }
  else if (ev.type === "error") { setWorking(false); showError(ev.message); }
}

async function generate() {
  clearError();
  $("out").classList.add("hidden");
  $("steps").innerHTML = "";
  const topic = $("topic").value.trim();
  if (topic.length < 3) return showError("Please enter a topic.");

  const mode = $("mode").value;
  const groqKey = $("groqKey").value.trim(), tavilyKey = $("tavilyKey").value.trim(), ownerPw = $("ownerPw").value;
  if (mode === "owner" && !ownerPw) return showError("Enter the owner password.");
  sessionStorage.setItem("mode", mode); sessionStorage.setItem("groqKey", groqKey);
  sessionStorage.setItem("tavilyKey", tavilyKey); sessionStorage.setItem("ownerPw", ownerPw);

  const payload = {
    topic, language: $("language").value, content_type: $("contentType").value,
    tone: $("tone").value, length: $("length").value, model: $("model").value, use_web: $("useWeb").checked,
    ...(mode === "owner"
      ? { owner_password: ownerPw }
      : { groq_key: groqKey || null, tavily_key: tavilyKey || null }),
  };

  $("go").disabled = true; $("progress").classList.remove("hidden"); setWorking(true);
  try {
    const res = await fetch("/api/generate", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
    });
    if (!res.ok) {
      let msg = "Request failed.";
      try { const j = await res.json(); if (typeof j.detail === "string") msg = j.detail; } catch (_) {}
      throw new Error(msg);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        if (chunk.startsWith("data: ")) handleEvent(JSON.parse(chunk.slice(6)));
      }
    }
  } catch (e) {
    setWorking(false); showError(e.message || "Network error.");
  } finally {
    setWorking(false); $("go").disabled = false;
  }
}

$("go").addEventListener("click", generate);
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(currentDraft); $("copy").textContent = "Copied"; }
  catch (_) { $("copy").textContent = "Copy failed"; }
  setTimeout(() => ($("copy").textContent = "Copy"), 1500);
});
$("dl").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([currentDraft], { type: "text/markdown" }));
  const a = document.createElement("a"); a.href = url; a.download = "output.md"; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
